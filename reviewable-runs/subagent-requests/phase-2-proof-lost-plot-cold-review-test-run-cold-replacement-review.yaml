    schema_version: 1
    verdicts:
      allowed:
      - pass
      - fail
      - defer
      - stale
      required_for_replacement_north_star: pass
    required_sections:
    - verdict
    - source_hashes_checked
    - line_grounded_findings
    - scaffold_residue_check
    - evidence_and_plot_drift_check
    - unresolved_blockers
  integration_decision:
    artifact_id: cold_replacement_review_integration_decision
    path_template: reviewable-runs/integration-decisions/{run_id}-run-cold-replacement-review-integration.yaml
    schema_version: 1
    required_for_gate: replacement_north_star
    allowed_decisions:
    - accept_pass
    - accept_fail
    - reject_stale
    - reject_out_of_scope
    - defer_for_revision
    must_record:
    - accepted_or_rejected_result_path
    - result_verdict
    - source_hash_match
    - rationale
  source_hash_expectations:
    algorithm: sha256
    require_request_hashes: true
    require_result_hash_echo: true
    stale_on_mismatch: true
    sources:
    - packet_manifest
    - live_draft
    - candidate_draft
    - governing_brief
    - plot_contract
    - publication_voice_guide
  required_verdict_checks:
  - compare_candidate_against_live_draft
  - judge_north_star_replacement_quality
  - verify_plot_contract_preserved
  - verify_evidence_anchors_preserved_or_explicitly_replaced
  - verify_no_scaffold_or_template_residue
  failure_triggers:
  - id: scaffold_residue
    severity: blocking
    examples:
    - duplicate terminal sections after references
    - unfilled template prompts or drafting instructions
    - placeholder TODO/TK markers in publication body
  - id: evidence_drift
    severity: blocking
    description: Candidate substitutes, drops, or overstates required evidence anchors
      without explicit reviewable rationale.
  - id: plot_drift
    severity: blocking
    description: Candidate loses the declared public object, thesis, forbidden frames,
      or stop conditions from the plot_contract.
  - id: ungrounded_north_star_pass
    severity: blocking
    description: Review recommends replacement without line-grounded findings against
      live draft, candidate, and plot_contract.
  - id: stale_sources
    severity: blocking
    description: Result source hashes do not match the request source hashes.
  blocks:
    gate: replacement_north_star
    until:
      result_verdict: pass
      integration_decision: accept_pass
