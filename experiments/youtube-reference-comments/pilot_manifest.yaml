experiment:
  name: youtube-reference-comments
  posture: draft_review_only
  max_references_per_comment: 5
  comment_style:
    lead: This brief leans most heavily on these sources
    require_guidance_sentence: true
    end_with_full_references_link: true
  policy_guardrails:
  - Keep comments on-topic for the specific video.
  - Avoid near-identical wording across a broad backfill wave.
  - Do not dump the full bibliography into YouTube comments.
  - Review drafts manually before posting.
