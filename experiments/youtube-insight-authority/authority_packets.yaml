    local CLI planner; channel mutation still requires both --apply and
    --apply-youtube.
  applied_at: "2026-05-16T10:16:40Z"
  apply_report: private-overlay:youtube-insight-authority/apply-report
  final_readback_report: private-overlay:youtube-insight-authority/final-readback
