packets:
  - slug: illusion_of_swarm
    youtube_video_id: q3_gPM4E8yw
    package: publications/illusion-of-swarm
    title: Boundary First, Then More Workers
    claim: Splitting work across extra workers is a workaround unless each worker owns a real boundary.
    description: >
      Extra workers feel like scale, but they create handoffs before they
      create intelligence. Add another worker only when it owns a different
      boundary in memory, tools, permissions, or evaluation.
    evidence:
      - Local cinematic captions show the single-worker versus swarm comparison.
      - The paired research breakdown covers the 53.7 percent token reduction and coordination tax.
      - The essay argues that decomposition quality beats coordination theater.
    thumbnail_text: BOUNDARY FIRST
    source_url: https://lambpetros.substack.com/p/the-illusion-of-the-swarm
    research_breakdown_url: https://www.youtube.com/watch?v=AigaLYfpFZc
    author_note: I was skeptical of the anti-swarm framing until the cost and latency comparison made the boundary test unavoidable.
    technical_dilemma: If one worker can hold the context and tools, what exact boundary justifies the second one?
    pinned_comment: >
      Technical provocation: if one worker can hold the context, tools, and
      checks, the second worker is probably a tax. What boundary would make
      you split the work anyway?
    tags:
      - systems
      - research
      - software

  - slug: operating_agents_memory
    youtube_video_id: J9dz9_9YPQw
    package: publications/autonomous-agents/essays/memory
    title: When Memory Has No Owner
    claim: Memory fails when stored facts do not have an authority rule that decides what wins.
    description: >
      A larger memory store can still fail when the system has no rule for
      which fact wins. The repair is not more recall; it is an owner for
      conflicts.
    evidence:
      - Local captions frame memory failure as attention and authority loss.
      - The paired research breakdown distinguishes recall from governed state.
      - Shorts follow-through isolates authority failure in compact examples.
    thumbnail_text: MEMORY CONFLICT
    source_url: https://lambpetros.substack.com/p/operating-agents-ii-memory-needs
    research_breakdown_url: https://www.youtube.com/watch?v=Pj4sjWvyJVQ
    author_note: The useful shift was treating memory as a control surface, not a bigger storage bucket.
    technical_dilemma: When memory conflicts with the current task, which source should win, and where is that rule stored?
    pinned_comment: >
      Technical provocation: memory is not useful unless something owns the
      conflict rule. In your stack, what decides which remembered fact wins?
    tags:
      - memory
      - systems
      - research

  - slug: operating_agents_multi_agent
    youtube_video_id: abBHq8lwCEE
    package: publications/autonomous-agents/essays/multi-agent
    title: The Second Worker Needs a Boundary
    claim: A second worker earns its place only when it owns a distinct boundary in state, action, or evaluation.
    description: >
      More workers do not automatically add intelligence. They add handoffs.
      The useful design question is whether the second worker owns a different
      boundary or only repeats the same context with a new label.
    evidence:
      - Local captions state the boundary test for worker splits.
      - The paired research breakdown covers handoffs, tools, and evaluation boundaries.
      - Existing Shorts isolate the coordination tax failure mode.
    thumbnail_text: SECOND BOUNDARY
    source_url: https://lambpetros.substack.com/p/operating-agents-iv-the-second-agent
    research_breakdown_url: https://www.youtube.com/watch?v=xxd2VKlqiL4
    author_note: The rule that survived review was not more roles; it was sharper ownership boundaries.
    technical_dilemma: What has to be different before the second worker is design, not theater?
    pinned_comment: >
      Technical provocation: a second worker should buy a boundary, not a job
      title. What boundary do you require before adding one?
    tags:
      - systems
      - design
      - research

  - slug: operating_agents_reasoning
    youtube_video_id: bto9FNWlahY
    package: publications/autonomous-agents/essays/reasoning
    title: Fix the Support Before the Model
    claim: Many reasoning failures come from weak task support before they come from weak models.
    description: >
      Shopping for a stronger model is often the late move. First inspect the
      task support: decomposition, checks, state, and the handoff between plan
      and action.
    evidence:
      - Local captions diagnose the support layer before model choice.
      - The paired research breakdown covers planning and reasoning supports.
      - The Shorts package isolates the failed-support pattern.
    thumbnail_text: FIX SUPPORT
    source_url: https://lambpetros.substack.com/p/operating-agents-iii-diagnose-the
    research_breakdown_url: https://www.youtube.com/watch?v=LykGDaONozw
    author_note: The strongest corrective move was to inspect the task support before blaming the model.
    technical_dilemma: When a model fails a task, how do you separate model weakness from broken support?
    pinned_comment: >
      Technical provocation: before changing the model, inspect the support
      around it. What check tells you the failure is really model-side?
    tags:
      - reasoning
      - systems
      - research

  - slug: operating_agents_optimization
    youtube_video_id: n99g7mLWQek
    package: publications/autonomous-agents/essays/optimization
    title: Stop Tuning Instructions; Test the Process
    claim: Optimization works when the work process becomes the object under test.
    description: >
      Instruction tweaks are too small an object. If the inputs, checks, evidence,
      and failure rules are weak, the thing to test is the work process itself.
    evidence:
      - Local captions frame optimization around the work process itself.
      - The paired research breakdown connects evaluation loops to production behavior.
      - Existing Shorts show drift from small instruction changes.
    thumbnail_text: TEST THE PROCESS
    source_url: https://lambpetros.substack.com/p/operating-agents-bonus-the-workflow
    research_breakdown_url: https://www.youtube.com/watch?v=2Fs1iDw5I3Y
    author_note: The useful unit of improvement turned out to be the process, not the sentence-level instruction.
    technical_dilemma: What do you measure when the work process, not the model, is the thing changing?
    pinned_comment: >
      Technical provocation: if you only tune instructions, you miss the object
      that actually fails. What part of your work process is under test?
    tags:
      - evaluation
      - systems
      - research

  - slug: hardware_friction_map
    youtube_video_id: xPLU4cISmxE
    package: publications/hardware-friction
    title: Hardware Friction Decides What Ships
    claim: Hardware friction decides which designs survive deployment pressure.
    description: >
      The cleanest architecture can still lose if memory movement, kernels,
      cost, or availability make it impossible to run. Hardware friction is the
      filter between a good paper and production.
    evidence:
      - Local captions frame hardware friction as the shipping filter.
      - The essay maps friction points that block deployment.
      - Shorts follow-through covers FlashAttention and ecosystem lag.
    thumbnail_text: DEPLOYMENT FILTER
    source_url: https://lambpetros.substack.com/p/the-hardware-friction-map
    research_breakdown_url: null
    author_note: The decisive evidence was how often elegant designs failed because the hardware path was not ready.
    technical_dilemma: When a design looks better on paper, what hardware friction would make you reject it?
    pinned_comment: >
      Technical provocation: elegance does not ship by itself. What hardware
      constraint would make you reject a better-looking design?
    tags:
      - hardware
      - systems
      - research

  - slug: what_actually_works_hardware
    youtube_video_id: Ju5UJvO4X5k
    package: publications/hardware-friction/what-actually-works-the-hardware
    title: Hardware Fit Filters Progress
    claim: Architecture progress becomes real only after it passes the hardware compatibility filter.
    description: >
      A design is not progress until it fits the hardware path that has to run
      it. Chips, kernels, memory paths, tooling, and cost decide whether the
      idea survives.
    evidence:
      - Local captions frame compatibility as the deployment filter.
      - The essay compares designs through hardware constraints.
      - The Shorts package includes concrete filter examples.
    thumbnail_text: HARDWARE FIT
    source_url: https://lambpetros.substack.com/p/what-actually-works-the-hardware
    research_breakdown_url: null
    author_note: The research forced the question away from novelty and toward compatibility.
    technical_dilemma: What compatibility test should a new design pass before you call it progress?
    pinned_comment: >
      Technical provocation: novelty is cheap until the hardware path rejects
      it. What compatibility test do you use before calling a design progress?
    tags:
      - hardware
      - systems
      - research

  - slug: specification_surface_source_of_truth
    youtube_video_id: slozjRp6CPg
    package: publications/literate-workflow-programming/specification-surface-source-of-truth
    title: Specs Need a Surface
    claim: Generated code becomes reviewable when controlling intent lives in a maintained specification surface.
    description: >
      Fast code generation creates the wrong kind of speed if intent is only in
      chat. Reviewable work needs a surface that names decisions, tests, and
      the rule for changing them.
    evidence:
      - Local captions connect generated code to maintained specs.
      - The paired research breakdown covers why specs become source authority.
      - Visual slide assets expose the specification surface as an inspectable object.
    thumbnail_text: SPEC SURFACE
    source_url: https://lambpetros.substack.com/p/the-specification-surface-is-the
    research_breakdown_url: https://www.youtube.com/watch?v=I6gKAyYRfZU
    author_note: The key point is not documentation volume; it is where controlling intent is allowed to live.
    technical_dilemma: If intent lives only in chat, what exactly is a reviewer supposed to verify?
    pinned_comment: >
      Technical provocation: generated code is not reviewable until intent has
      a surface. Where does controlling intent live in your build process?
    tags:
      - specifications
      - systems
      - research
