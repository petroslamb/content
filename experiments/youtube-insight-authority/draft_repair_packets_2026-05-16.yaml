  id: insight_authority_next_repair_candidates_2026_05_16
  experiment_id: insight_authority_cinematic
  created_at: "2026-05-16"
  status: draft_only
  purpose: >
    Prepare the next packaging-repair queue from the 2026-05-16 channel
    recovery triage. These packets are intentionally not merged into
    authority_packets.yaml because the videos still belong to the cinematic
    rollout naming convention until that owner approves the suffix change.
  source_report: experiments/youtube-analytics/channel_recovery_plan_2026-05-16.md
