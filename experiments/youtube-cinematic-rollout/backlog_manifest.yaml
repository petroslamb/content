experiment:
  name: youtube-cinematic-rollout
  workspace_root: experiments/youtube-cinematic-rollout
  existing_video_map: experiments/youtube-cinematic-pilot/metrics/video_asset_youtube_map.yaml
  release_ledger: experiments/youtube-cinematic-rollout/release_ledger.md
  automation:
    daily_starter_id: daily-cinematic-starter
    watcher_automation_id: cinematic-rollout-watcher-2
  templates:
    cinematic_prompt: experiments/youtube-cinematic-pilot/copy/cinematic_prompt.txt
    cinematic_description: experiments/youtube-cinematic-pilot/copy/cinematic_description_template.md
  playlists:
    cinematic:
      id: PL8lPx5mgRhhZZYl9fPWLf8J5rJM8FRIHe
      title: Rooted Layers Cinematic Briefs
      privacy_status: public
    shorts:
      id: PL8lPx5mgRhhbMQQ70d-C4dAKKKPzCd5Hd
      title: AI Architecture Snippets & AI Research Shorts
  defaults:
    timezone: Europe/Athens
    daily_run_time: '10:00'
    max_new_cinematics_per_run: 2
    poll_interval_seconds: 600
    notebooklm_generation_wait_timeout_seconds: 21600
    youtube_caption_wait_timeout_seconds: 7200
    auth_relogin_command: .venv/bin/notebooklm login
    shorts_primary_video_label: Full cinematic video
    shorts_secondary_video_label: Full research breakdown
    shorts_overlay:
      enabled: true
      source: cinematic_srt
      render_strategy: top_hook_spoken_subtitles_bottom_cta
      default_cta: Full cinematic brief in Related Video
      caption_wrap_width: 30
      hook_max_words: 9
      quality_check:
        sample_frames_per_short: 3
        require_top_hook: true
        require_spoken_subtitles: true
        require_bottom_cta: true
    shorts_slot_times:
    - 09:00
    - '10:30'
    - '12:00'
    - '13:30'
    - '15:00'
    - '16:30'
    - '18:00'
    - '19:30'
    - '21:00'
    - '22:30'
    shorts_not_before_date: '2026-05-03'
    candidate_min_seconds: 35
    candidate_target_seconds: 90
    candidate_max_seconds: 120
    rubric_thresholds:
      approved_min: 22
      reserve_min: 20
  states:
    generation_blocking:
    - queued
    - blocked_auth_expired
    - blocked_rate_limited
    - retryable_error
    in_flight:
    - generation_pending
    - cinematic_uploaded
    - captions_pending
    - shorts_selection_pending
    - shorts_schedule_pending
    - shorts_render_pending
    - shorts_upload_pending
    terminal:
    - completed
    - no_shorts_approved
rollout_order:
- illusion_of_swarm
- the_agent_revolution
- operating_agents_action
- operating_agents_memory
- operating_agents_reasoning
