version: 1
route_authority: workflow_yaml_and_package_status
evidence_policy:
  run_record: required
  gate_store: reviewable-runs/gates/
  resolved_run_required_when:
    - governed
    - gated
    - resumable
    - continuous
    - audit_relevant
default_enforcement:
  external_mutation: deny
  lifecycle_movement: deny
  promotion: deny
profiles:
  article_default:
    description: Default package-development flow from research through release.
    run_mode: governed_continuous
    ordered_workflows:
      - research
      - paper_intake
      - evidence_authorization
      - essay_iteration
      - notebooklm_artifacts
      - article_polish
      - release_gate
      - substack_publishing
      - archive_sync
      - youtube_production
      - distribution
    required_gates:
      - research_exit
      - essay_prewrite
      - replacement_north_star
      - release_readiness
    gate_policy:
      stop_at_required_gates: true
      external_mutation_requires_gate: release_readiness
      lifecycle_movement_requires_gate: true
    allowed_entry_workflows:
      - topic_discovery
      - research
      - paper_intake
      - evidence_authorization
      - essay_iteration
      - notebooklm_artifacts
      - article_polish
      - release_gate
      - youtube_production
    fallback_routes:
      research_exit: research
      essay_prewrite: essay_iteration
      replacement_north_star: essay_iteration
      release_readiness: release_gate
  midstream_revision:
    description: Re-enter an existing package from the middle without pretending the whole lifecycle restarts.
    run_mode: governed_continuous
    ordered_workflows:
      - evidence_authorization
      - research
      - essay_iteration
      - notebooklm_artifacts
      - article_polish
      - release_gate
      - youtube_production
    required_gates:
      - research_exit
      - essay_prewrite
      - replacement_north_star
      - release_readiness
    gate_policy:
      stop_at_required_gates: true
      external_mutation_requires_gate: release_readiness
      lifecycle_movement_requires_gate: true
    allowed_entry_workflows:
      - evidence_authorization
      - research
      - essay_iteration
      - notebooklm_artifacts
      - article_polish
      - release_gate
    fallback_routes:
      research_exit: research
      essay_prewrite: essay_iteration
      replacement_north_star: essay_iteration
      release_readiness: article_polish
  post_ceiling_successor:
    description: Experimental successor-object search after a flagship object hits a genuine ceiling.
    run_mode: governed_continuous
    stability: experimental
    ordered_workflows:
      - post_ceiling_pivot
      - topic_discovery
      - research
      - essay_iteration
    required_gates:
      - pivot_research_grounding
      - pivot_north_star_viability
      - research_exit
      - essay_prewrite
    gate_policy:
      stop_at_required_gates: true
      external_mutation_requires_gate: null
      lifecycle_movement_requires_gate: true
    allowed_entry_workflows:
      - post_ceiling_pivot
      - topic_discovery
      - research
    fallback_routes:
      pivot_research_grounding: post_ceiling_pivot
      pivot_north_star_viability: post_ceiling_pivot
      research_exit: research
      essay_prewrite: essay_iteration
