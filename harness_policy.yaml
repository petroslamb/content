version: 1
mode: local-first
policy_position: policy_floor
read_only_allowed:
  operations:
    - repo exploration
    - package status inspection
    - workflow resolution
    - package audit
    - contract validation
    - gate inspection
    - run record inspection
local_write_allowed:
  paths:
    - publications/
    - publication_strategy_and_archive/
    - README.md
    - scripts/
    - reviewable-runs/resolved-runs/
    - reviewable-runs/logs/
    - reviewable-runs/gates/
  operations:
    - package scaffolding
    - launch pack generation
    - local scripted stage execution
    - resolved run persistence
    - run record writing
    - gate artifact creation
    - local validation reports
governance_maintenance_write_allowed:
  paths:
    - AUTHORITY.md
    - AGENTS.md
    - README.md
    - package.json
    - harness_policy.yaml
    - gate_contracts.yaml
    - pipeline_profiles.yaml
    - phased-strategy/
    - workflows/
    - scripts/
    - tests/
    - experiments/
    - publications/README.md
    - reviewable-runs/README.md
    - reviewable-runs/logs/README.md
    - reviewable-runs/gates/README.md
  operations:
    - authority map maintenance
    - workflow contract maintenance
    - policy and profile edits
    - index and README maintenance
    - experiment state indexing
    - validation surface maintenance
auto_mark_done_allowed:
  runner_modes:
    - scripted
  step_modes:
    - scriptable
  denied_stages:
    - notebooklm_artifacts
    - substack_publishing
    - distribution
approval_required:
  stages:
    - notebooklm_artifacts
    - substack_publishing
    - distribution
  approval_gates:
    - required_before_publish
    - required_before_live_publish
    - required_before_external_posting
    - required_before_channel_mutation
  gate_types:
    - external_mutation
    - lifecycle_movement
    - promotion
disallowed_without_explicit_user_request:
  stages:
    - substack_publishing
    - distribution
  actions:
    - live publish
    - authenticated remote mutation
    - playlist mutation
    - external posting
governed_execution:
  run_modes:
    - exploratory
    - governed_continuous
  continue_until:
    - review_gate
    - external_mutation_gate
    - terminal_failure
    - budget_limit
    - workflow_completion
  resolved_run_required_when:
    - governed
    - gated
    - resumable
    - continuous
    - audit_relevant
enforcement_surfaces:
  contract_shape: deny
  package_route_resolution: deny
  context_admission: deny
  tool_use: deny
  path_access: deny
  preconditions: deny
  invariants: detect
  budgets: detect
  expected_outputs: detect
  validation_hooks: deny
  review_gates: deny
  external_mutation: deny
  lifecycle_movement: deny
  gate_approval: deny
  promotion: deny
  trace_completeness: detect
review_gate_store:
  gate_path: reviewable-runs/gates/
  run_record_path: reviewable-runs/logs/
  resolved_run_path: reviewable-runs/resolved-runs/
  quality_approval_distinct_from_external_mutation: true
  decisions:
    - approve
    - reject
    - defer
