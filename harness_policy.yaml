version: 1
mode: local-first
policy_position: policy_floor
read_only_allowed:
  operations:
    - repo exploration
    - package status inspection
    - workflow resolution
    - package audit
    - contract validation
    - gate inspection
    - run record inspection
local_write_allowed:
  paths:
    - publications/
    - publication_strategy_and_archive/
    - README.md
    - scripts/
    - reviewable-runs/resolved-runs/
    - reviewable-runs/logs/
    - reviewable-runs/gates/
    - reviewable-runs/subagent-requests/
    - reviewable-runs/subagent-results/
    - reviewable-runs/integration-decisions/
    - .private/youtube/
  operations:
    - package scaffolding
    - launch pack generation
    - local scripted stage execution
    - resolved run persistence
    - run record writing
    - gate artifact creation
    - local validation reports
    - private YouTube operational overlay updates
governance_maintenance_write_allowed:
  paths:
    - AUTHORITY.md
    - AGENTS.md
    - README.md
    - package.json
    - harness_policy.yaml
    - gate_contracts.yaml
    - pipeline_profiles.yaml
    - phased-strategy/
    - workflows/
    - scripts/
    - tests/
    - experiments/
    - publications/README.md
    - reviewable-runs/README.md
    - reviewable-runs/logs/README.md
    - reviewable-runs/gates/README.md
  operations:
    - authority map maintenance
    - workflow contract maintenance
    - policy and profile edits
    - index and README maintenance
    - experiment state indexing
    - validation surface maintenance
auto_mark_done_allowed:
  runner_modes:
    - scripted
  step_modes:
    - scriptable
  denied_stages:
    - notebooklm_artifacts
    - substack_publishing
    - distribution
approval_required:
  stages:
    - notebooklm_artifacts
    - substack_publishing
    - distribution
  approval_gates:
    - required_before_publish
    - required_before_live_publish
    - required_before_external_posting
    - required_before_channel_mutation
  gate_types:
    - external_mutation
    - lifecycle_movement
    - promotion
disallowed_without_explicit_user_request:
  stages:
    - substack_publishing
    - distribution
  actions:
    - live publish
    - authenticated remote mutation
    - playlist mutation
    - external posting
governed_execution:
  run_modes:
    - exploratory
    - governed_continuous
  continue_until:
    - review_gate
    - external_mutation_gate
    - terminal_failure
    - budget_limit
    - workflow_completion
  resolved_run_required_when:
    - governed
    - gated
    - resumable
    - continuous
    - audit_relevant
codex_session_handoff:
  default_mode: defer_to_subagent
  compatibility_mode: same_session
  allowed_modes:
    - policy_default
    - defer_to_subagent
    - same_session
  resolution_order:
    - step.codex_session_handoff.mode
    - workflow.codex_session_handoff.default_mode
    - harness_policy.codex_session_handoff.default_mode
  runtime_contract:
    content_agent_model_spawning: deny
    content_agent_request_emission: allow
    content_agent_result_validation: allow
    content_agent_direct_codex_execution: deny
  artifact_paths:
    subagent_request_path: reviewable-runs/subagent-requests/
    subagent_result_path: reviewable-runs/subagent-results/
    integration_decision_path: reviewable-runs/integration-decisions/
  mode_semantics:
    policy_default: Resolve by the declared resolution_order before execution.
    defer_to_subagent: Emit a deterministic request artifact for the codex_session step, then defer for a worker outside content-agent to produce the result and integration artifacts.
    same_session: Preserve compatibility behavior by deferring at the codex_session boundary without creating a subagent request artifact.
  generic_contract:
    enabled_for_codex_session_without_agent_contract: true
    synthesized_from:
      - workflow_id
      - step_id
      - package
      - run_id
      - step.consumes
      - step.produces
      - resolved_output_targets
      - resolved_input_source_hashes
    gate_critical_steps_require_explicit_agent_contract: true
enforcement_surfaces:
  contract_shape: deny
  package_route_resolution: deny
  context_admission: deny
  tool_use: deny
  path_access: deny
  preconditions: deny
  invariants: detect
  budgets: detect
  expected_outputs: detect
  validation_hooks: deny
  review_gates: deny
  external_mutation: deny
  lifecycle_movement: deny
  gate_approval: deny
  promotion: deny
  trace_completeness: detect
review_gate_store:
  gate_path: reviewable-runs/gates/
  run_record_path: reviewable-runs/logs/
  resolved_run_path: reviewable-runs/resolved-runs/
  subagent_request_path: reviewable-runs/subagent-requests/
  subagent_result_path: reviewable-runs/subagent-results/
  integration_decision_path: reviewable-runs/integration-decisions/
  quality_approval_distinct_from_external_mutation: true
  decisions:
    - approve
    - reject
    - defer
