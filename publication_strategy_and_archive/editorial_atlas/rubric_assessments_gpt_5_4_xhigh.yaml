  rationale:
    whole_essay_note: The essay is a strong historical synthesis object rather than a flagship public argument. Its main strength is turning a broad arc from AlexNet through transformer-era family design into one stable claim about the shift from bespoke diagrams to reusable scaffolds. It is more controlled and better landed than the broad survey pieces, but it carries less ignition and debate energy than the archive's strongest public objects.
    opening_anchor: 'Lines 10-18: the opening moves quickly from the older stage-script picture to the named scaffold frame, giving the piece a clear contract without the cold-start force of Transformer Attractor or Autonomy Tax.'
    middle_anchor: 'Lines 44-125: the ResNet, Transformer, and families/recipes sections build the argument in a disciplined sequence, with the residual-path turn and later family-design turn doing the real structural work.'
    ending_anchor: 'Lines 121-129: the conclusion sharpens the thesis into a portable historical read and lands with a clear final formulation of architecture as scaffold rather than hand-authored machine.'
