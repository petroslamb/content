      fluently while failing to maintain the associations those
      descriptions depend on. Creates recognition immediately.
    middle_anchor: >
      The border-setting section — distinguishing binding failure from
      hallucination, from attention degradation, from grounding failure —
      is the strongest analytical passage. Each distinction earns its place.
    ending_anchor: >
      Closes by reframing binding as a structural rather than scaling
      problem. Clean landing with enough provocation to create forward
      motion.

