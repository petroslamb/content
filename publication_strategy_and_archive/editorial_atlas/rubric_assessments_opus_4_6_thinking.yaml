      The most evidence-dense piece in the archive. The "hardware
      compatibility filter" is a genuinely useful frame: architectures must
      pass through GPU-primitive and memory-hierarchy gates to achieve
      adoption. Utility is high because the heuristic is immediately
      applicable. Synthesis is strong across the SSM/attention/hybrid
      landscape. The cost is structural pacing: 10K words create inevitable
      fatigue. The piece would be stronger at two-thirds the length.
    opening_anchor: >
      "Not every good idea in deep learning survives contact with real
      hardware." Strong functional opening that establishes the filter
      thesis quickly.
    middle_anchor: >
      The architecture-by-architecture hardware compatibility analysis
      (Mamba, RWKV, Griffin, Jamba) is the load-bearing section. Each case
      is tested against the same filter, creating accumulative evidence.
    ending_anchor: >
      Closes with the adoption-lag thesis and practical implications.
      Clean landing but not explosive; the essay earns respect more than
      debate.

