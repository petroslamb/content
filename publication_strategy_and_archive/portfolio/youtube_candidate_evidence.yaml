    transcript_claim_anchors:
      - timestamp: "00:00:00,480"
        claim: >-
          A clean AI-generated pull request with passing tests can still delete
          a critical retry branch and lock the production database.
      - timestamp: "00:00:48,000"
        claim: >-
          Architectural intent left in an ephemeral developer-model chat is
          invisible to the reviewer of the resulting code.
      - timestamp: "00:01:03,600"
        claim: >-
          Vibe coding creates a velocity mismatch: generated implementation
          outpaces the human team's ability to reverse-engineer its reasoning.
      - timestamp: "00:01:57,520"
        claim: >-
          When a shared specification is reduced to bare function signatures,
          independent agents make conflicting assumptions about integration.
      - timestamp: "00:02:20,400"
        claim: >-
          Restoring the full specification restores the shared decisions needed
          to align the agents' work.
      - timestamp: "00:02:25,280"
        claim: >-
          The proposed solution is a specification surface: a durable written
          artifact that captures intent in a way code cannot.
      - timestamp: "00:02:48,400"
        claim: >-
          Natural-language constraints gain operational force when converted to
          executable tests that can physically reject non-compliant code.
      - timestamp: "00:04:09,439"
        claim: >-
          When a bug is found, the governed workflow updates the specification,
          regenerates the agent, and overwrites the old implementation.
      - timestamp: "00:04:30,240"
        claim: >-
          The engineering role shifts from writing implementation to governing
          intent.

