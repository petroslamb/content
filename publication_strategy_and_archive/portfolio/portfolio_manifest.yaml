    notes: The public snapshot is authoritative, but the only matching package is
      a pre-viability scaffold and the newest cited papers are not locally captured.
      This prevents flagship selection and is disclosed in the manifest.
  factual_risk:
    status: MEDIUM
    notes: Most core claims are normative and carefully bounded, but all cited research
      is extremely recent, the paper summaries were not locally verified, and no evidence
      validates the full five-part audit as one production control system.
  evidence_anchors:
  - 'L12-L18: States the adoption-under-pressure thesis and defines capability as
    a model-harness configuration.'
  - 'L22-L32: Separates harness evaluation from attractive traces and distinguishes
    availability, exposure, and adherence evidence.'
  - 'L36-L44: Grounds repair in failed trajectories, environment-state verification,
    and explicit protocol authority questions.'
  - 'L48-L62: Gives a concrete before-and-after recovery flow with bounded workers,
    independent review, integration, and release gates.'
  - 'L64-L92: Specifies invocation, consumption, adherence, independent review, and
    regression as the adoption audit.'
  rationale: A strong operational synthesis that makes the right unit of evaluation
    the model-harness configuration and introduces a reusable adoption audit for learned
    workflow changes. It is not flagship evidence because the five-part audit is proposed
    rather than demonstrated, the article substantially overlaps the governance flagships,
    and the video-first wrapper leaves the Markdown without a concrete implementation
    or evaluation result.
  confidence: HIGH
  approval_status: APPROVED
  application_status: NOT_APPLIED
