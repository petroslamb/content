  source_lineage:
    status: PARTIAL
    published_snapshot: publication_strategy_and_archive/substack_archive/2026-07-07_harnesses-that-learn-under-audit-e06.md
    status_manifest: publications/agent-harnesses/status.yaml
    readme: publications/agent-harnesses/README.md
