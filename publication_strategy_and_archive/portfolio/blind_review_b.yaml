protocol:
  review_id: blind_review_b
  review_date: "2026-08-22"
  corpus_source: publication_strategy_and_archive/substack_archive/metadata.json
  corpus_filter: "audience == everyone"
  corpus_count: 25
  audience:
    - senior AI engineers
    - technical hiring managers
    - serious collaborators
  judgment_sequence:
    - "Read every public essay Markdown and fix the initial content judgment."
    - "Only after that judgment, inspect publication-package files when needed for provenance."
    - "Ignore package marketing labels, self-ratings, and workflow stage claims when choosing tiers."
  excluded_sources:
    - ROOTED_LAYERS_CODEX_PLAN.md
    - editorial_atlas/atlas_data.json
    - "rubric_assessments_*.yaml"
    - editorial_atlas/archive/
    - prior rankings and portfolio candidate lists
  edits_during_review: false
  numeric_aggregate_score: not_used
  tier_caps:
    FLAGSHIP: 4
    SUPPORTING: 4
  tier_meaning:
    FLAGSHIP: "Lead portfolio evidence: distinctive, credible, and useful to the target audience."
    SUPPORTING: "Strong complementary evidence, but narrower, more derivative, or less proven than a flagship."
    ARCHIVE: "Do not lead the public portfolio with this post; this does not necessarily mean the essay is poor."
  confidence_meaning: "Confidence in this review recommendation, not confidence claimed by the essay."
  provenance_legend:
    VERIFIED_REPO: "The central contribution or described topology is directly traceable to repository artifacts."
    MIXED: "Direct or local evidence exists, but substantial bridges depend on external synthesis or unsupported inference."
    SYNTHESIS: "A traceable literature or engineering synthesis without first-party validation of the combined thesis."
    UNVERIFIED: "The available package lineage does not adequately recover evidence for central claims."
  remote_verification: "Not performed; provenance is limited to the public Markdown and local publication packages."

summary:
  FLAGSHIP: 4
  SUPPORTING: 4
  ARCHIVE: 17
  flagship_slugs:
    - the-specification-surface-is-the
    - confidence-debt
    - the-illusion-of-the-swarm
    - when-the-llm-programs-its-own-thinking
  supporting_slugs:
    - harnesses-that-learn-under-audit-e06
    - the-binding-gap
    - the-autonomy-tax
    - neural-architecture-design-as-a-compositional-32e

posts:
  - slug: harnesses-that-learn-under-audit-e06
    source_file: publication_strategy_and_archive/substack_archive/2026-07-07_harnesses-that-learn-under-audit-e06.md
    tier: SUPPORTING
    rationale: >-
      A strong operational synthesis that makes the right unit of evaluation the model-harness
      configuration and introduces a reusable adoption audit for learned workflow changes. It is
      not flagship evidence because the five-part audit is proposed rather than demonstrated,
      the article substantially overlaps the governance flagships, and the video-first wrapper
      leaves the Markdown without a concrete implementation or evaluation result.
    evidence_anchors:
      - "L12-L18: States the adoption-under-pressure thesis and defines capability as a model-harness configuration."
      - "L22-L32: Separates harness evaluation from attractive traces and distinguishes availability, exposure, and adherence evidence."
      - "L36-L44: Grounds repair in failed trajectories, environment-state verification, and explicit protocol authority questions."
      - "L48-L62: Gives a concrete before-and-after recovery flow with bounded workers, independent review, integration, and release gates."
      - "L64-L92: Specifies invocation, consumption, adherence, independent review, and regression as the adoption audit."
    confidence: HIGH
    factual_risk: MEDIUM
    factual_risk_notes: >-
      Most core claims are normative and carefully bounded, but all cited research is extremely
      recent, the paper summaries were not locally verified, and no evidence validates the full
      five-part audit as one production control system.
    provenance_status: SYNTHESIS
    source_lineage_conflicts:
      - "The matching agent-harnesses package says it is only a pre-viability topic-discovery placeholder and has no publication mapping or canonical essay."
      - "The adjacent local harness-paper index was captured in April 2026 and omits the May-July 2026 papers carrying this essay; public citation links are the only visible lineage for them."

