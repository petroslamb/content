      - "What Confidence Debt Is."
      - "The Doctrine and its claim, evaluation, and human gates."
    evidence_uncertainty: >-
      The linked repository and commit-pinned evidence were outside the blind
      corpus. Much of the supporting literature is recent or preprint-based,
      and the essay correctly acknowledges that the combined stack lacks
      end-to-end validation.

  - slug: "the-binding-gap"
    tier: "SUPPORTING"
    content_type: "mixed"
    confidence: "HIGH"
    factual_risk: "MEDIUM"
    rationale: >-
      A tightly bounded conceptual essay with an unusually good opening, a
      serious mechanistic bridge, clear neighboring failure classes, and a
      falsifiable engineering wager. It remains strong portfolio support, but
      the newer harness-audit essay provides more direct operational evidence
      and displaces it from the capped Flagship set.
    evidence_anchors:
      - >-
        The Tom Smith and Mary Stone reversal and the definition of exact
        binding.
      - "When Binding Load Rises and meta-analysis tuple extraction."
      - >-
