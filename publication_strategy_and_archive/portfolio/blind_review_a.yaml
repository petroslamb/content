protocol_statement: >-
  Independent blind portfolio review for senior AI engineers, technical hiring
  managers, and serious collaborators. The review used only the public-post
  metadata, all 25 referenced public essay Markdown files, and the
  non-evaluative editorial rubric. It did not inspect ROOTED_LAYERS_CODEX_PLAN,
  atlas_data.json, rubric assessment files, editorial_atlas/archive, prior
  rankings, or candidate lists. No numeric aggregate scores were used.

corpus_count: 25

reviews:
  - slug: "harnesses-that-learn-under-audit-e06"
    tier: "FLAGSHIP"
    content_type: "mixed"
    confidence: "HIGH"
    factual_risk: "MEDIUM"
    rationale: >-
      A sharp operational thesis backed by a concrete evidence chain: a harness
      has not learned merely because it generated a repair; the next
      consequential run must prove invocation, exposure, adherence, review, and
      regression safety. The essay turns self-improvement from an attractive
      trace into an auditable release discipline, making it unusually relevant
      to senior engineers and technical decision-makers.
    evidence_anchors:
      - >-
        The opening claim that a harness has not learned until the next real run
        proves it used the change, together with Capability Is A Configuration.
      - >-
        The Run That Proves It and the migration example's failure, scoped
        repair, independent review, integration decision, and later exercised
        path.
      - >-
        The Adoption Audit: invocation, consumption, adherence, independent
        review, and regression.
    evidence_uncertainty: >-
      The core adoption standard is the author's synthesis rather than a
      validated industry protocol. Its supporting evidence is dominated by
      very recent 2026 preprints plus vendor and protocol documentation, none of
      which was independently checked under the blind protocol.

  - slug: "the-specification-surface-is-the"
    tier: "FLAGSHIP"
    content_type: "mixed"
    confidence: "HIGH"
    factual_risk: "MEDIUM"
    rationale: >-
      A memorable, operational distinction between documentation and governed
      authority. It demonstrates strong concept control, translates research
      into review practice, and handles obvious overclaims before they weaken
      the thesis.
    evidence_anchors:
      - >-
        The Hidden Authority Problem: the code is visible while the authority
        behind it is not.
      - "What Makes A Surface Real."
      - "The Context File Trap together with Limits."
    evidence_uncertainty: >-
      The central synthesis relies heavily on 2025-2026 preprints that were not
      independently checked. Specification surface is the author's integrating
      frame rather than a directly validated category.

  - slug: "confidence-debt"
    tier: "FLAGSHIP"
    content_type: "mixed"
    confidence: "HIGH"
    factual_risk: "MEDIUM"
    rationale: >-
      The strongest end-to-end portfolio object. It begins with an inspectable
