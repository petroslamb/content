candidate_decisions:
  - video_id: "hNVBrptmRVs"
    title: "Why Polished AI Reports Can Outrun the Evidence | A Cinematic Research Brief"
    current_visibility: public
    playlist_decision: SELECTED_WORK_QUALIFIER
    visibility_decision: KEEP_PUBLIC
    selected_order: 1
    confidence: MEDIUM
    lineage_status: RESOLVED
    contribution_status: MIXED_FIRST_PARTY_AND_SYNTHESIS
    factual_risk: MEDIUM
    rationale: >-
      The video begins with the author's eip-verify failure, defines confidence
      debt precisely, and turns it into claim-auditability, reliability-release,
      and co-audit controls. That is a distinctive systems-governance argument,
      not a generic paper recap. The exact 8:58.68 Confidence Debt caption fits
      the 8:59 video and the package source; the autonomy-tax mapping in triage
      is conclusively wrong. The script is more categorical than the essay
      about the unvalidated combined control stack, so this does not earn high
      confidence, but its core first-party case and benchmark anchor remain
      inspectable and no unresolved high-risk central claim was found.
    evidence_anchors:
      - >-
        youtube_candidate_evidence.yaml: resolved SRT
        publications/confidence-debt/artifacts/video/cinematic-backfill-2026-04-27/confidence_debt_cinematic.srt,
        sha256 b48814c7c1c147421ef358db8b9f2e7617b1a1321564976b0ac31f35e899d8d5,
        229 cues, 538.68 seconds against a 539-second video.
      - >-
        SRT 00:00:34-00:01:49: the polished report conflicts with row-level
        evidence and the script defines confidence debt as downstream trust
        outrunning warranted proof.
      - >-
        SRT 00:02:57-00:04:01: claim auditability is made concrete and the
        tau-bench 61-percent pass@1 versus below-25-percent pass^8 contrast is
        preserved from the source essay.
      - >-
        publication_strategy_and_archive/substack_archive/2026-04-17_confidence-debt.md
        L12-L24, L28-L38, L46-L90, and L92-L122: direct project evidence,
        concept definition, two engineering gates, and the co-audit proposal.
    concerns:
      - >-
        The narration calls the eip-verify builders "the researchers" instead
        of clearly naming the author's role; contribution is recovered from the
        linked source package rather than from the video alone.
      - >-
        The video presents the full three-gate repair more definitively than the
        essay, which explicitly says the co-audit workspace is an invention
        assembled from adjacent findings rather than a validated product stack.
      - >-
        The original cinematic upload/provenance record is weaker than the five
        later publication_cinematic reports; the exact local SRT lineage is
        resolved, but the public description does not disclose the generation
        workflow.

  - video_id: "slozjRp6CPg"
    title: "Specs Need a Surface"
    current_visibility: public
    playlist_decision: DO_NOT_SELECT
    visibility_decision: KEEP_PUBLIC
    selected_order: null
    confidence: HIGH
    lineage_status: RESOLVED
    contribution_status: HONEST_SYNTHESIS_IN_SOURCE_PACKAGE
    factual_risk: MEDIUM_HIGH
    rationale: >-
      The underlying essay is flagship-quality, but the video drops the limits
      that make it credible. It turns a scoped specification-authority spectrum
      into universal claims that scaling requires a rigid central specification,
      that code should be overwritten rather than edited, and that the future of
      engineering is no longer implementation. The invented locked-database
      opening is also presented as a concrete production incident. Keep the
      public explainer, but do not feature it as selected technical evidence.
    evidence_anchors:
      - >-
        Exact SRT publications/literate-workflow-programming/specification-surface-source-of-truth/artifacts/video/specification_surface_cinematic.srt,
        sha256 29157e3358e16f45379885e320305d6417edddaca9091b7150e7676ddc9570b7,
        281.24 seconds against a 282-second video.
      - >-
        SRT 00:00:00-00:01:03: a hypothetical pull request is escalated into a
        database-locking catastrophe and then generalized into the vibe-coding
        diagnosis.
      - >-
        SRT 00:02:20-00:04:30: full-spec recovery, executable constraints, and
        a far-end spec-as-program pattern are narrated as the general solution.
      - >-
        Source essay L34-L36 and L102-L106 explicitly restrict spec-as-source to
        domains and tooling that can support it and reject universal adoption;
        those scope limits are missing from the video.

  - video_id: "chr4R-fSZUY"
    title: "Models Need a REPL for Thought"
    current_visibility: public
    playlist_decision: DO_NOT_SELECT
    visibility_decision: KEEP_PUBLIC
    selected_order: null
    confidence: HIGH
    lineage_status: RESOLVED
    contribution_status: VERIFIED_FIRST_PARTY_ENGINEERING_IN_SOURCE_PACKAGE
    factual_risk: HIGH
    rationale: >-
      This has the strongest personal engineering contribution in the candidate
      set, but the video is not a safe standalone representation of it. It urges
      removing the model from isolation and sharing a Jupyter heap while omitting
      the source essay's non-isolation, code-execution, token-cost, tail-cost,
      and production-scalability limits. It also says a turn-based API requires
      throwing away an entire run after one error, which is an unjustified
      categorical claim. The implementation should remain public, but the
      current cinematic should not be the selected-work representative.
    evidence_anchors:
      - >-
        Exact SRT publications/programmable-thinking/artifacts/video/programmable_thinking_cinematic.srt,
        sha256 ee10b2878430b0ecdc54fa962118135cab7a0e4769c8679b7fad98daf7738c25,
        319.479 seconds against a 320-second video.
      - >-
        SRT 00:01:19-00:02:53 accurately explains external prompt storage,
        model-written filtering code, and chunk-boundary failure.
      - >-
        SRT 00:03:50-00:04:39 moves to the shared Jupyter workspace and surgical
        correction but provides no execution-isolation or production boundary.
      - >-
        Source essay L30-L83 documents the author's shared-namespace and trace
        artifacts; L172-L202 explicitly records non-isolated execution, failure,
        cost variance, and unresolved production/usability questions.

  - video_id: "q3_gPM4E8yw"
    title: "Boundary First, Then More Workers"
    current_visibility: public
    playlist_decision: DO_NOT_SELECT
    visibility_decision: KEEP_PUBLIC
    selected_order: null
    confidence: HIGH
    lineage_status: RESOLVED
    contribution_status: SYNTHESIS
    factual_risk: HIGH
    rationale: >-
      The useful boundary-first thesis is overwhelmed by unbounded narration.
      A scoped compilation result becomes "same quality, twice as fast, half
      the price"; a selected benchmark becomes a general negative trend with
      agent count; a tool-routing hypothesis is narrated as a mathematical
      disambiguation wall; and the essay's swarm-as-training-rig prediction is
      asserted as the future of the industry. The video is distinctive but not
      sufficiently defensible for selected work.
    evidence_anchors:
      - >-
        Exact SRT publications/illusion-of-swarm/artifacts/video/illusion_of_swarm_cinematic.srt,
        sha256 a336ad313a9c7fc8378011cd78eaa6e170acfdcfe83c544ed73808307999cab0,
        326.6 seconds against a 327-second video.
      - >-
        SRT 00:00:30-00:00:52: the 53.7-percent token result and 180-configuration
        benchmark are stated without the source-study scope.
      - >-
        SRT 00:01:55-00:04:00: tool confusability, agent namespaces, rare
        multi-agent exceptions, and process-aware distillation are compressed
        into a settled anti-swarm trajectory.
      - >-
        blind_review_b.yaml records MEDIUM_HIGH source-essay risk because the
        precise results are recent preprints and the training-rig section partly
        extends them by analogy; the video removes that hypothesis boundary.

  - video_id: "bhoiLFJadAA"
    title: "The Model Kept the Facts. It Dropped the Wiring | A Cinematic Research Brief"
    current_visibility: public
    playlist_decision: DO_NOT_SELECT
    visibility_decision: KEEP_PUBLIC
    selected_order: null
    confidence: HIGH
    lineage_status: RESOLVED
    contribution_status: SYNTHESIS
    factual_risk: HIGH
    rationale: >-
      The binding-gap diagnosis is memorable, but the video turns a bounded
      synthesis into a single demonstrated mechanism. It jumps from reversal
      tests to citation drift, a fabricated clinical example, dense
      meta-analysis extraction, and an ordering-subspace account while speaking
      as though one established causal pathway explains all of them. The source
      review explicitly says those extensions are plausible rather than broadly
      demonstrated. The live description also identifies this as a prompt-packet
      retest whose requested opening was not preserved. Keep public as an
      experiment; do not feature.
    evidence_anchors:
      - >-
        Exact SRT publications/binding-gap/artifacts/video/prompt-packet-retest-2026-05-05/binding_gap_prompt_packet_retest_cinematic.srt,
        sha256 2009339cac8342eb4fdc0196a7d9de55f66a6db3650eaa83437c5867cc63dcbc,
        311.479 seconds against a 312-second video.
      - >-
        SRT 00:00:57-00:03:30: reversal curse, citation drift, clinical role
        reversal, meta-analysis tuple extraction, and ordering subspace are
        presented as one mechanical chain.
      - >-
        SRT 00:04:05-00:04:43: fluency is treated as a statistical reflex and
        schema records are offered as the repair without the source predictions'
        boundary.
      - >-
        blind_review_a.yaml and blind_review_b.yaml record that the move from
        controlled entity binding to attribution, numeric, legal, clinical,
        and code failures is adjacent-evidence synthesis, not a unified result.

  - video_id: "0TpfmqhoB6s"
    title: "Why AI Design Converged on the Same Scaffold | A Cinematic Research Brief"
    current_visibility: public
    playlist_decision: DO_NOT_SELECT
    visibility_decision: KEEP_PUBLIC
    selected_order: null
    confidence: HIGH
    lineage_status: RESOLVED
    contribution_status: HONEST_RESEARCH_SYNTHESIS_IN_SOURCE_PACKAGE
    factual_risk: HIGH
    rationale: >-
      The source essay is careful technical breadth; the video is not. It
      misdescribes deep-network degradation as destructive representation
      rewriting and an optimizer getting lost, calls Transformer blocks the
      exact same residual scaffold pioneered by ResNet, says probing studies
      prove a governable blank slate is infinitely more capable than designed
      systems, and declares MoE specialization safe because a router contains
      it. Those are central, categorical mechanistic claims, not harmless
      compression. Keep the video public, but do not use it as portfolio proof.
    evidence_anchors:
      - >-
        Exact SRT publications/neural-architectures/neural-architecture-design-as-a-compositional-32e/artifacts/video/neural_architecture_design_cinematic.srt,
        sha256 1e39283b86edd777c421c4af478062373b1f8b9ced0db0c0fd640a66e8024c89,
        349.16 seconds against a 349-second video.
      - >-
        SRT 00:01:25-00:02:24: the ResNet degradation and skip-connection story
        is simplified into an asserted failure mechanism.
      - >-
        SRT 00:02:54-00:05:05: Transformer residuals, BERT layer probes,
        Chinchilla scaling, and MoE routing are converted into inevitability and
        safety claims.
      - >-
        blind_review_a.yaml notes that the historical arc compresses competing
        causes; blind_review_b.yaml rates the source LOW_MEDIUM risk precisely
        because it is interpretive and avoids inevitability claims that the
        video reintroduces.

