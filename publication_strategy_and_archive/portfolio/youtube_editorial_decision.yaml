unresolved_evidence:
  - >-
    The rendered local MP4s named in the Shorts upload reports are not present,
    so byte identity and frame-by-frame comparison cannot be proven locally.
    The proposals rely on stronger-than-title evidence: same source video/SRT,
    exact clip windows, identical audio/video probe durations, upload lineage,
    remastered-overlay manifests, and matching current public metadata.
  - >-
    youtube_triage.json maps each Short to a full-package SRT rather than a
    short-specific caption track. Those shared-caption groups were not used to
    authorize unlisting.
  - >-
    youtube_duplicate_evidence.yaml preserves ready_to_unlist_old false for
    every pair. That was a prepublication operational state, not a later live
    review, and its underlying private/P0D conditions are resolved in the
    current ledger. A fresh readback is still mandatory before application.
  - >-
    Five later cinematic upload reports record a publication_cinematic workflow
    and Notebook id. hNVBrptmRVs has exact caption and package lineage but lacks
    a comparably complete original upload report. None of the current public
    descriptions explicitly discloses the narration/generation workflow.
  - >-
    No full audiovisual playthrough was available in the local evidence packet.
    Standalone clarity was judged from exact-duration captions and source
    artifacts; this is why the sole qualifier is MEDIUM rather than HIGH confidence.
  - >-
    Every visibility decision is still a proposal. The authenticated live state
    must be read back against the approved manifest immediately before any
    mutation; drift defaults to KEEP_PUBLIC.

