schema_version: 1
created_at: "2026-08-22"
method:
  blind_reviews:
    - blind_review_a.yaml
    - blind_review_b.yaml
  corpus_count: 25
  numeric_aggregate_score_used: false
  atlas_consulted_after_blind_reviews: true
  decision_rule: >-
    Select only work that clears the technical-evaluator bar and has defensible
    lineage, contribution, factual-risk, and standalone-presentation evidence.
    The homepage capacities are ceilings, not quotas.

blind_agreement:
  agreed_flagship:
    - the-specification-surface-is-the
    - confidence-debt
    - when-the-llm-programs-its-own-thinking
  agreed_supporting:
    - the-binding-gap
    - neural-architecture-design-as-a-compositional-32e
  agreed_archive_count: 15
  material_disagreements:
    - slug: harnesses-that-learn-under-audit-e06
      review_a: FLAGSHIP
      review_b: SUPPORTING
      resolution: SUPPORTING
      reason: >-
        The adoption-audit frame is strong, but the matching package remains a
        pre-viability scaffold, the cited May-July evidence is not locally
        captured, and the essay proposes rather than demonstrates the full
        five-part control system. That unresolved lineage blocks flagship use.
    - slug: the-illusion-of-the-swarm
      review_a: SUPPORTING
      review_b: FLAGSHIP
      resolution: FLAGSHIP
      reason: >-
        The package has resolved public-to-source lineage, a substantial paper
        and claim-ledger trail, a distinctive bottleneck-diagnosis contribution,
        explicit load-bearing exceptions, and falsifiable predictions. Its
        recent-preprint dependence is a bounded medium risk, not a blocking one.
    - slug: operating-agents-bonus-the-workflow
      review_a: SUPPORTING
      review_b: ARCHIVE
      resolution: ARCHIVE
      reason: >-
        The operating doctrine is credible but too course-dependent and generic
        to consume the final supporting slot.
    - slug: the-autonomy-tax
      review_a: ARCHIVE
      review_b: SUPPORTING
      resolution: ARCHIVE
      reason: >-
        The framework is useful, but the casebook mixes unlike record types and
        the quantitative language creates avoidable factual and pseudo-precision
        risk. It remains a rewrite candidate rather than selected evidence.

atlas_disagreement_detection:
  atlas_scope: >-
    The canonical atlas covered 22 of the now 25 public posts and was consulted
    only after both blind judgments were fixed.
  confirmations:
    - >-
      The atlas independently identifies Confidence Debt and The Binding Gap as
      high-precision, evidence-forward publication objects, consistent with the
      blind reviews.
    - >-
      It also recognizes The Illusion of the Swarm as a balanced builder-facing
      synthesis and When the LLM Programs Its Own Thinking as a technical builder
      essay.
  disagreements:
    - >-
      The atlas promotes The Transformer Attractor as its strongest publication
      object, while both blind passes place it in ARCHIVE because uncited
      quantitative and mechanistic claims create high credibility risk.
    - >-
      The atlas treats the autonomy and hardware-friction essays as highly useful
      operator objects, while the blind passes surface casebook heterogeneity,
      false precision, and package correction files that materially weaken those
      public claims.
    - >-
      The atlas predates both the specification-surface essay and the new
      harness-audit essay, so it cannot supply evidence for their selection.
  conclusion: >-
    Atlas publication energy is retained as prior evidence, but factual-risk and
    provenance findings override it where the surfaces disagree.

final_homepage:
  flagship:
    - slug: the-specification-surface-is-the
      why: >-
        Defines a governed specification surface and turns it into a practical
        architecture for authority, invariants, execution, and review.
    - slug: confidence-debt
      why: >-
        Connects a first-party evidence failure to an operational doctrine for
        claim auditability, reliability release, and human co-audit.
    - slug: when-the-llm-programs-its-own-thinking
      why: >-
        Shows direct engineering contribution through shared Jupyter state,
        replayable traces, executable examples, and explicit operational limits.
    - slug: the-illusion-of-the-swarm
      why: >-
        Replaces decorative agent-count thinking with coordination economics,
        typed boundaries, and concrete tests for when multi-agent structure earns
        its cost.
  supporting:
    - slug: harnesses-that-learn-under-audit-e06
      why: >-
        Offers a sharp five-part adoption audit for proving that a learned
        harness change actually shaped a later consequential run.
    - slug: the-binding-gap
      why: >-
        Provides a compact diagnostic for systems that preserve the right facts
        while attaching them to the wrong entities, roles, or variables.
    - slug: neural-architecture-design-as-a-compositional-32e
      why: >-
        Adds technically careful breadth through a primary-source history of
        reusable blocks, path discipline, design spaces, and controlled
        heterogeneity.
  unused_supporting_capacity_reason: >-
    No fourth candidate adds enough distinct, low-risk evidence to justify
    filling the slot. The cap is not a quota.

