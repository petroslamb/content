topic_packets:
  - packet: scripts/fixtures/workflow-model/topic-packet-package-init-ready.md
    gate: topic_viability
    expected_status: pass
    expected_decision: package_init_ready
route_checks:
  - package: literate-workflow-programming
    stage: notebooklm_artifacts
    expected_pipeline_profile: post_ceiling_successor
    expected_effective_workflow: post_ceiling_pivot
    expected_effective_next_action: stop_without_successor
    expected_effective_can_execute: false
    expected_recommended_workflow: post_ceiling_pivot
    expected_active_overlay: post_ceiling_pivot
    expected_overlay_phase: pivot_search_stopped
    expected_next_overlay_action: stop_without_successor
    expected_overlay_route: no_successor
workflow_resolution_checks:
  - workflow: post_ceiling_pivot
    package: clean-interface-illusion
    expected_can_execute: false
    expected_overlay_phase: upgrade_to_umbrella
    expected_next_overlay_action: upgrade_to_umbrella_and_create_donor_leaf
    expected_active_overlay_root: publications/clean-interface-illusion
    expected_validator_substring: check:package-lifecycle
    expected_recommended_gates:
      - pivot_research_grounding
      - pivot_north_star_viability
  - workflow: post_ceiling_pivot
    package: literate-workflow-programming
    expected_can_execute: false
    expected_overlay_phase: pivot_search_stopped
    expected_next_overlay_action: stop_without_successor
    expected_overlay_route: no_successor
    expected_active_overlay_root: publications/literate-workflow-programming
    expected_validator_substring: pivot_north_star_viability
    expected_recommended_gates:
      - pivot_research_grounding
      - pivot_north_star_viability
gate_checks:
  - gate: research_exit
    package: clean-interface-illusion
    expected_status: pass
    expected_decision: ready_for_essay_iteration
  - gate: pivot_research_grounding
    package: clean-interface-illusion
    expected_status: pass
    expected_decision: pivot_cleared_for_north_star_attempt
  - gate: pivot_north_star_viability
    package: clean-interface-illusion
    expected_status: pass
    expected_decision: north_star_viable
  - gate: release_readiness
    package: literate-workflow-programming
    expected_status: blocked
validator_coverage:
  - workflow: research
    validator_substring: check_research_exit_gate.py
  - workflow: essay_iteration
    validator_substring: check:essay-prewrite
retained_examples:
  logs:
    - path: reviewable-runs/logs/2026-04-22_17-24-40_no-package_topic_viability_gate-check.json
      kind: gate_check
    - path: reviewable-runs/logs/2026-04-22_17-27-13_no-package_topic_discovery_workflow-launch-pack.json
      kind: workflow_launch_pack
    - path: reviewable-runs/logs/2026-04-22_17-27-13_no-package_topic_discovery_emit_launch_pack.json
      kind: workflow_run
    - path: reviewable-runs/logs/2026-04-22_17-27-13_clean-interface-illusion_essay_iteration_launch-pack.json
      kind: harness_launch_pack
    - path: reviewable-runs/logs/2026-04-22_19-07-04_literate-workflow-programming_replacement_north_star_gate-check.json
      kind: gate_check
    - path: reviewable-runs/logs/2026-04-22_19-07-57_literate-workflow-programming_replacement_north_star_gate-check.json
      kind: gate_check
    - path: reviewable-runs/logs/2026-04-22_19-08-10_clean-interface-illusion_pivot_research_grounding_gate-check.json
      kind: gate_check
  artifacts:
    - path: publications/clean-interface-illusion/clean-interface-illusion-pivot-decision.md
      label: pivot-clearance decision
    - path: publications/clean-interface-illusion/clean-interface-illusion-pivot-north-star-viability.md
      label: pivot north-star viability artifact
    - path: publications/literate-workflow-programming/literate-workflow-programming-ceiling-report-r3.md
      label: canonical ceiling report
