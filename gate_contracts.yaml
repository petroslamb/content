version: 1
gates:
  topic_viability:
    description: Decide whether a topic-discovery packet is mature enough to initialize a package.
    scope: packet
    required_artifacts:
      - topic-discovery packet with an explicit handoff decision
      - carry-forward package fields when the decision is package_init_ready
    recommended_workflow: topic_discovery
    recommended_validator: "npm run gate:check -- --gate topic_viability --packet <topic-packet>"
    proof_mode: topic_packet
  research_exit:
    description: Decide whether research is complete enough to hand the package into essay_iteration.
    scope: package
    required_artifacts:
      - governing blueprint or brief
      - local evidence surface
      - research-exit gate artifact
    recommended_workflow: research
    recommended_validator: ".venv/bin/python scripts/check_research_exit_gate.py --package <package>"
    proof_mode: package_gate
  essay_prewrite:
    description: Decide whether the active essay object is actually writable before bounded candidate drafting.
    scope: package
    required_artifacts:
      - essay-iteration packet manifest
      - hardened blueprint
      - essay prewrite gate
    recommended_workflow: essay_iteration
    recommended_validator: "npm run check:essay-prewrite -- --package <package>"
    proof_mode: packet_gate
  replacement_north_star:
    description: Decide whether the latest bounded candidate clears replacement and north-star review or whether the object has hit a ceiling.
    scope: package
    required_artifacts:
      - replacement review
      - promotion decision
      - current packet manifest
      - ceiling report when the stop gate fires
    recommended_workflow: essay_iteration
    recommended_validator: "npm run check:essay-iteration -- --package <package>"
    proof_mode: packet_review
  pivot_research_grounding:
    description: Decide whether a post-ceiling pivot candidate is grounded enough to justify a real second publication object under an umbrella package.
    scope: package
    required_artifacts:
      - ceiling report or legacy donor-report pair
      - pivot grounding review
      - pivot decision or live candidate status
      - umbrella upgrade when the donor package is no longer single-publication
    recommended_workflow: post_ceiling_pivot
    recommended_validator: "npm run gate:check -- --gate pivot_research_grounding --package <package>"
    proof_mode: overlay_gate
  pivot_north_star_viability:
    description: Decide whether a grounded pivot candidate is strong enough to open a successor flagship leaf or whether the package should stop without a successor.
    scope: package
    required_artifacts:
      - pivot grounding review
      - pivot north-star viability gate
      - pivot decision
      - successor leaf initialization when the new flagship object is adopted
    recommended_workflow: post_ceiling_pivot
    recommended_validator: "npm run gate:check -- --gate pivot_north_star_viability --package <package>"
    proof_mode: overlay_gate
  release_readiness:
    description: Decide whether a package is safe to publish or externally mutate.
    scope: package
    required_artifacts:
      - canonical live draft
      - release-gate checklist or decision note
      - publish target and approval context when external mutation is requested
    recommended_workflow: release_gate
    recommended_validator: "npm run gate:check -- --gate release_readiness --package <package>"
    proof_mode: release_checklist
